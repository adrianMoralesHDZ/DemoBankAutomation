# =====================================================================
# DemoBankAutomation - Configuracion del Framework
# =====================================================================
# Este archivo centraliza TODA la configuracion del entorno de ejecucion.
# Cambia estos valores segun tu dispositivo/emulador sin tocar codigo Java.
# =====================================================================

# ---------------------------------------------------------------------
# Appium Server
# ---------------------------------------------------------------------
appium.server.url=http://127.0.0.1:4723/

# ---------------------------------------------------------------------
# Dispositivo / Emulador
# ---------------------------------------------------------------------
# Obtener el ID con: adb devices
device.name=ZY22KVZPQ4

# ---------------------------------------------------------------------
# App DemoBank
# ---------------------------------------------------------------------
app.package=com.demobank.app
app.activity=com.demobank.app.MainActivity

# ---------------------------------------------------------------------
# Credenciales de DemoBank (app mockeada)
# ---------------------------------------------------------------------
credentials.email=demo@demo.com
credentials.password=1234

# ---------------------------------------------------------------------
# Tesseract OCR
# ---------------------------------------------------------------------
# Ruta donde estan los archivos .traineddata
tesseract.datapath=C:\\Program Files\\Tesseract-OCR\\tessdata
tesseract.language=spa

# ---------------------------------------------------------------------
# Reportes Allure - Modo de captura de screenshots
# ---------------------------------------------------------------------
# true  = capturar screenshot en cada paso del flujo (por defecto)
# false = capturar screenshot unicamente en fallos
allure.screenshots.everyStep=true
